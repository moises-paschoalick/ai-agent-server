spring.application.name=agent-server

# HTTP port: platforms such as Railway inject PORT; 8080 otherwise
server.port=${PORT:8080}

# LLM: model is "alias", "provider:model" or a plain name (goes to the default provider)
agent.llm.default=${AGENT_LLM_DEFAULT:openai:${AGENT_LLM_MODEL:gpt-5.4-mini}}
agent.llm.temperature=${AGENT_LLM_TEMPERATURE:0.3}
agent.llm.timeout=${AGENT_LLM_TIMEOUT:60s}
agent.llm.max-retries=${AGENT_LLM_MAX_RETRIES:2}

# Providers: an empty api-key keeps the provider declared but inactive;
# models (comma-separated) only feeds the list of GET /models for the front's selector
agent.llm.providers.openai.type=openai-compatible
agent.llm.providers.openai.base-url=${AGENT_LLM_BASE_URL:https://api.openai.com/v1}
agent.llm.providers.openai.api-key=${OPENAI_API_KEY:${LLM_API_KEY:}}
agent.llm.providers.openai.models=${AGENT_OPENAI_MODELS:}

agent.llm.providers.anthropic.type=anthropic
agent.llm.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
agent.llm.providers.anthropic.models=${AGENT_ANTHROPIC_MODELS:}

agent.llm.providers.gemini.type=gemini
agent.llm.providers.gemini.api-key=${GEMINI_API_KEY:}
agent.llm.providers.gemini.models=${AGENT_GEMINI_MODELS:}

agent.llm.providers.openrouter.type=openai-compatible
agent.llm.providers.openrouter.base-url=https://openrouter.ai/api/v1
agent.llm.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
agent.llm.providers.openrouter.models=${AGENT_OPENROUTER_MODELS:}

agent.llm.providers.xai.type=openai-compatible
agent.llm.providers.xai.base-url=https://api.x.ai/v1
agent.llm.providers.xai.api-key=${XAI_API_KEY:}
agent.llm.providers.xai.models=${AGENT_XAI_MODELS:}

# Aliases (example):
# agent.llm.aliases.fast.model=openrouter:meta-llama/llama-3.3-70b-instruct:free
# agent.llm.aliases.fast.temperature=0.2

# API keys accepted by this server (comma-separated; empty = every protected route answers 401)
agent.api-keys=${AGENT_API_KEYS:}

# Agent engine: tool rounds per user message; optional system prompt of /chat
agent.engine.max-tool-rounds=${AGENT_MAX_TOOL_ROUNDS:10}
agent.chat.system-prompt=${AGENT_CHAT_SYSTEM_PROMPT:}

# /v1 runs: a run waiting in requires_action expires after this; how often expiration is checked
agent.runs.expires-after=${AGENT_RUN_EXPIRES:600s}
agent.runs.expiration-check=30s

# Tools: catalog file directory and time zone of the date/time system tool
agent.data-dir=${AGENT_DATA_DIR:./data}
agent.timezone=${AGENT_TIMEZONE:America/Sao_Paulo}
# System tools in executions with an assistant: all = every one (default); declared = only those the assistant declares
agent.tools.system-mode=${AGENT_SYSTEM_TOOLS_MODE:all}

# /v1 assistants: true = saved in <agent.data-dir>/assistants.json; false = memory only (real data)
agent.assistants.persist=${AGENT_ASSISTANTS_PERSIST:true}

# Storage: memory = conversations and runs in memory, assistants and tools in <agent.data-dir> (default);
# postgres = everything in PostgreSQL. DATABASE_URL: postgresql://user:password@host:port/db or jdbc:postgresql://...
agent.store.type=${AGENT_STORE:memory}
agent.store.database-url=${DATABASE_URL:}
# Audit events older than this are deleted once a day
agent.audit.retention=${AGENT_AUDIT_RETENTION:90d}

spring.threads.virtual.enabled=true

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
